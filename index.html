<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roman Casterline</title>
<meta name="description" content="Roman Casterline — Director of Data and Technology">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="Roman Casterline">
<meta property="og:description" content="Director of Data and Technology">
<meta property="og:image" content="avatar.jpg">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="avatar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --ink: #fff;
    --muted: rgba(255,255,255,.78);
    --line: rgba(255,255,255,.55);
    --red: #e3141b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); }
  body {
    font-family: "Montserrat", system-ui, sans-serif;
    min-height: 100svh;
    display: flex; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }

  .card {
    position: relative;
    width: 100%; max-width: 520px; min-height: 100svh;
    overflow: hidden; isolation: isolate;
    container-type: inline-size;
    background: #000;
    display: flex; flex-direction: column;
  }

  /* ---------- photo (office background baked in, fades to black) ---------- */
  .hero { position: absolute; top: 0; left: 0; width: 100%; height: auto; z-index: -2; pointer-events: none; user-select: none; }
  .shade { position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(90deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,.25) 38%, transparent 55%); }

  /* ---------- content ---------- */
  .content { position: relative; padding: 0 7cqw; display: flex; flex-direction: column; flex: 1; }
  .name {
    margin-top: 26cqw;
    font-family: "Jost", "Montserrat", sans-serif; font-weight: 300; text-transform: uppercase;
    font-size: clamp(24px, 7.9cqw, 42px); line-height: 1.02; letter-spacing: 0; text-shadow: 0 2px 12px rgba(0,0,0,.45);
  }
  .rule { width: 24cqw; height: 4px; background: var(--red); margin: 4cqw 0 3cqw; border: 0; }
  .title { font-family: "Jost", "Montserrat", sans-serif; font-weight: 400; font-size: clamp(16px, 4.6cqw, 24px); line-height: 1.25; text-shadow: 0 1px 8px rgba(0,0,0,.6); }

  .quick { display: flex; gap: 4.6cqw; margin: 11cqw 0 6cqw; }
  .quick a, .quick button {
    width: 15.5cqw; height: 15.5cqw; max-width: 82px; max-height: 82px; min-width: 52px; min-height: 52px;
    border: 1.25px solid var(--ink); border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(0,0,0,.25); color: var(--ink); cursor: pointer;
    transition: background .2s, transform .15s;
  }
  .quick a:hover, .quick button:hover { background: rgba(255,255,255,.12); }
  .quick a:active, .quick button:active { transform: scale(.94); }
  .quick svg { width: 54%; height: 54%; }

  .actions { display: flex; flex-direction: column; gap: 3cqw; margin-top: auto; padding-bottom: 0; }
  .site { text-align: center; margin: 10cqw 0 0; padding-bottom: max(4.5cqw, env(safe-area-inset-bottom)); color: rgba(255,255,255,.42); font-size: clamp(10px, 2.9cqw, 14px); letter-spacing: .14em; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .btn {
    display: flex; align-items: center;
    border: 1px solid var(--line); border-radius: 18px;
    background: rgba(12,12,13,.82);
    padding: 4cqw 4cqw 4cqw 0;
    transition: border-color .2s, background .2s, transform .15s;
  }
  .btn:hover { border-color: #fff; background: rgba(28,28,30,.9); }
  .btn:active { transform: scale(.985); }
  .btn .ico { flex: 0 0 21%; display: grid; place-items: center; }
  .btn .ico svg { width: 11cqw; max-width: 64px; height: auto; }
  .btn .txt { flex: 1; border-left: 1px solid var(--line); padding-left: 4cqw; min-width: 0; }
  .btn strong { display: block; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; font-size: clamp(12px, 4.15cqw, 24px); white-space: nowrap; }
  .btn span { display: block; color: var(--muted); font-weight: 400; font-size: clamp(10.5px, 3.2cqw, 17px); margin-top: .4em; line-height: 1.3; }
  .btn .chev { flex: 0 0 auto; width: 4.5cqw; max-width: 22px; margin-left: 2cqw; }

  .swoosh { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: auto; z-index: -1; pointer-events: none; }

  /* ---------- call / text sheet ---------- */
  .sheet-bg {
    position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.6);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet {
    width: 100%; max-width: 520px; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    background: #111; border-top: 3px solid var(--red); border-radius: 20px 20px 0 0;
    transform: translateY(100%); transition: transform .25s ease;
    display: grid; gap: 10px;
  }
  .sheet-bg.open .sheet { transform: none; }
  .sheet p { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 4px; }
  .sheet a, .sheet button {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 16px; border-radius: 14px; border: 1.5px solid var(--line);
    background: #000; color: #fff; font: 600 16px "Montserrat", sans-serif;
    letter-spacing: .05em; text-transform: uppercase; cursor: pointer;
  }
  .sheet a:first-of-type { background: var(--red); border-color: var(--red); }
  .sheet svg { width: 20px; height: 20px; }
  .sheet .cancel { border: 0; background: transparent; color: var(--muted); }

  :focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
  @media (min-width: 560px) { body { padding: 24px 0; } .card { min-height: 960px; border-radius: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.6); } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="card">
  <img class="hero" src="headshot.jpg" alt="Roman Casterline" width="1080" height="1440">
  <div class="shade" aria-hidden="true"></div>

  <div class="content">
    <h1 class="name">Roman<br>Casterline</h1>
    <hr class="rule">
    <p class="title">Director of Data<br>and Technology</p>

    <nav class="quick" aria-label="Quick contact">
      <button type="button" id="phoneBtn" aria-label="Call or text">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
      </button>
      <a id="emailBtn" href="#" aria-label="Send email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="1.5"/><path d="M3 6l9 7 9-7M3 18.5l6.8-6.3M21 18.5l-6.8-6.3"/></svg>
      </a>
      <a id="mapBtn" href="#" target="_blank" rel="noopener" aria-label="Directions to the office">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"><path d="M12 21.5s-6.5-7.3-6.5-12.3a6.5 6.5 0 0 1 13 0c0 5-6.5 12.3-6.5 12.3z"/><circle cx="12" cy="9.2" r="2.4"/></svg>
      </a>
    </nav>

    <div class="actions">
      <a class="btn" href="roman-casterline.vcf" download="Roman-Casterline.vcf">
        <span class="ico"><svg viewBox="0 0 48 34" fill="none" stroke="#fff" stroke-width="1.8"><rect x="2" y="2" width="44" height="30" rx="5"/><circle cx="15" cy="13" r="4.5"/><path d="M7 26c0-4.5 3.6-7 8-7s8 2.5 8 7" stroke-linecap="round"/><path d="M29 11h11M29 17h11M29 23h8" stroke-linecap="round"/></svg></span>
        <span class="txt"><strong>Add to Contacts</strong><span>Save my contact information</span></span>
        <svg class="chev" viewBox="0 0 12 20" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l8 8-8 8"/></svg>
      </a>
      <a class="btn" id="bookBtn" href="#" target="_blank" rel="noopener">
        <span class="ico"><svg viewBox="0 0 44 44" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="7" width="38" height="34" rx="4"/><path d="M3 16h38M13 3v8M31 3v8" stroke-linecap="round"/><g fill="#fff" stroke="none"><circle cx="13" cy="24" r="2"/><circle cx="20" cy="24" r="2"/><circle cx="27" cy="24" r="2"/><circle cx="34" cy="24" r="2"/><circle cx="13" cy="32" r="2"/><circle cx="20" cy="32" r="2"/><circle cx="27" cy="32" r="2"/></g></svg></span>
        <span class="txt"><strong>Schedule a Meeting</strong><span>See my calendar to book a time</span></span>
        <svg class="chev" viewBox="0 0 12 20" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l8 8-8 8"/></svg>
      </a>
      <a class="btn" id="linkedinBtn" href="#" target="_blank" rel="noopener">
        <span class="ico"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="3" fill="#0a66c2"/><path fill="#fff" d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45z"/></svg></span>
        <span class="txt"><strong>LinkedIn</strong><span>Connect with me on LinkedIn</span></span>
        <svg class="chev" viewBox="0 0 12 20" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l8 8-8 8"/></svg>
      </a>
    </div>
    <p class="site">www.romancasterline.com</p>
  </div>

  <svg class="swoosh" viewBox="0 0 520 90" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="rg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#7a0006"/><stop offset=".55" stop-color="#d0101a"/><stop offset="1" stop-color="#ff2a2f"/></linearGradient></defs>
    <polygon points="70,90 520,8 520,90" fill="url(#rg)"/>
  </svg>
</main>

<div class="sheet-bg" id="sheet" aria-hidden="true">
  <div class="sheet" role="dialog" aria-label="Call or text">
    <p id="sheetNum"></p>
    <a id="callLink" href="#"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>Call</a>
    <a id="textLink" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h16v12H8l-4 4z"/></svg>Text</a>
    <button type="button" class="cancel" id="sheetClose">Cancel</button>
  </div>
</div>

<script>
  /* ======== EDIT YOUR DETAILS HERE ======== */
  const CONFIG = {
    phone:    "+12293818162",          // digits with country code, used for call + text
    phoneDisplay: "(229) 381-8162",
    email:    "rcasterline@raineyga.com",
    office:   "1101 E Oglethorpe Blvd, Albany, GA 31705",   // corporate office address for navigation
    booking:  "https://outlook.office.com/bookwithme/user/37be033d86994647ab187d8e825063a6%40raineyga.com?anonymous&ismsaljsauthenabled",       // Bookings / Calendly link
    linkedin: "https://www.linkedin.com/in/roman-casterline-5821b2b7/"
  };
  /* ======================================== */

  const $ = id => document.getElementById(id);
  const ua = navigator.userAgent;
  const isApple = /iPhone|iPad|iPod|Macintosh/.test(ua) && 'ontouchend' in document || /iPhone|iPad|iPod/.test(ua);
  const dest = encodeURIComponent(CONFIG.office);

  $("emailBtn").href = "mailto:" + CONFIG.email;
  $("mapBtn").href = isApple
    ? "https://maps.apple.com/?daddr=" + dest
    : "https://www.google.com/maps/dir/?api=1&destination=" + dest;
  $("bookBtn").href = CONFIG.booking;
  $("linkedinBtn").href = CONFIG.linkedin;
  $("callLink").href = "tel:" + CONFIG.phone;
  $("textLink").href = "sms:" + CONFIG.phone;
  $("sheetNum").textContent = CONFIG.phoneDisplay;

  const sheet = $("sheet");
  const open = () => { sheet.classList.add("open"); sheet.setAttribute("aria-hidden", "false"); $("callLink").focus(); };
  const close = () => { sheet.classList.remove("open"); sheet.setAttribute("aria-hidden", "true"); $("phoneBtn").focus(); };
  $("phoneBtn").addEventListener("click", open);
  $("sheetClose").addEventListener("click", close);
  sheet.addEventListener("click", e => { if (e.target === sheet) close(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && sheet.classList.contains("open")) close(); });
</script>
</body>
</html>
